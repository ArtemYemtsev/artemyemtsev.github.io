<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Artem Yemtsev — Front-End Developer</title>
  <script>
    // Статический редирект для корня сайта (GitHub Pages не умеет серверный редирект).
    // Приоритет: cookie i18n_locale (выбор пользователя) → язык браузера → 'en'.
    (function () {
      var supported = ['en', 'ru', 'uk'];
      var fallback = 'en';
      var m = document.cookie.match(/(?:^|;\s*)i18n_locale=([^;]+)/);
      var lang = m
        ? decodeURIComponent(m[1])
        : (navigator.language || navigator.userLanguage || fallback).slice(0, 2).toLowerCase();
      if (supported.indexOf(lang) === -1) lang = fallback;
      window.location.replace('/' + lang + '/');
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/en/">
</head>
<body>
  <p>Redirecting… Choose a language:
    <a href="/en/">English</a> ·
    <a href="/ru/">Русский</a> ·
    <a href="/uk/">Українська</a>
  </p>
</body>
</html>
